name: songbook_app
description: "Worship Songbook App - A Flutter application for displaying hymns and worship songs with chord transposition and sheet music support."
publish_to: 'none'

# The build number here is a local-development placeholder. CI overrides it
# with the commit count at build time (see .github/workflows/deploy-pages.yml),
# so every deployment reports a distinct, increasing version. Bump the semantic
# part deliberately when a release is worth naming.
version: 1.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI
  flutter_svg: ^2.0.17

  # Utilities
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  collection: ^1.19.1
  package_info_plus: ^9.0.1

  # Song import (Phase B). `xml` parses MusicXML; `archive` unzips .mxl, which
  # is compressed MusicXML rather than a distinct format.
  xml: ^6.5.0
  archive: ^3.6.1

  # Choosing a MusicXML file to import. Works on web too (HTML file input),
  # which is the platform this is deployed on.
  file_picker: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

  # Testing
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sheet_music/
    - assets/data/
    - assets/icons/

  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
