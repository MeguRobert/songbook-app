    <line x1="386" y1="30" x2="386" y2="0" stroke="#333333" stroke-width="1.5"/>
    <!-- Dot -->
    <circle cx="395" cy="30" r="2" fill="#333333"/>

    <!-- Tie -->
    <path d="M306,33 Q343,45 374,33" stroke="#333333" stroke-width="1" fill="none"/>

    <!-- Double bar line (end) -->
    <line x1="450" y1="0" x2="450" y2="40" stroke="#333333" stroke-width="1"/>
    <line x1="456" y1="0" x2="456" y2="40" stroke="#333333" stroke-width="3"/>

    <!-- Lyrics -->
