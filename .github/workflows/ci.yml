name: CI

# The gate for work that is NOT a push to a deploying branch.
#
# `deploy-pages.yml` (master) and `deploy-staging.yml` (staging) each run analyze
# and test before they build, so both of those are covered. Everything else — a
# pull request, a push to a working branch — ran nothing at all: the first thing
# that ever checked a branch was the deploy that happened after it was merged,
# which is the one place a red build is expensive.
#
# Deliberately the same three checks as the deploy jobs and no more, so "CI is
# green" means the same thing on a branch as it does on master. If a check is
# added here it belongs in both deploys too.
#
# ONE DELIBERATE EXCEPTION, 2026-08-22: the deploys also run the browser walk
# (tools/browser-smoke/) and this workflow does not. The walk needs a release web
# build, which is the slowest thing in the pipeline, and it earns that cost by
# gating the commits that reach a served site — which arrive on master and
# staging, the two branches this workflow ignores. Adding it here would spend
# eight minutes on the rare fork pull request and change nothing about what
# ships. Since 2026-08-26 the ordinary path for feature work is the `staging`
# branch, which does get the walk, so the gap this comment describes is narrower
# than it was: it now covers only working branches and fork pull requests.

on:
  pull_request:
  push:
    branches-ignore:
      # Both of these are gated by their own deploy workflow, which runs the
      # same three checks before it builds. Running this one too would double
      # the minutes and give two statuses that can only ever agree.
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per branch, so a force-push supersedes its own run and not somebody else's.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    # A pull request from a branch in this repo already got a run from the `push`
    # trigger above, and `pull_request` would fire again on every synchronize —
    # two runs, two identical statuses, twice the minutes. Fork pull requests are
    # the case that genuinely needs the `pull_request` trigger: their pushes are
    # to somebody else's repo, so nothing else here ever sees them.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the deploy uses, and to the local dev
          # environment. A branch that passes here on a different SDK than the
          # one that will build it is not a gate.
          flutter-version: '3.35.2'
          channel: stable
          cache: true
          # `cache` is the SDK only; the pub dependencies are a separate input.
          pub-cache: true

      - name: Install dependencies
        working-directory: songbook_app
        run: flutter pub get

      - name: Analyze
        working-directory: songbook_app
        # Same threshold as the deploy: errors and warnings fail, the
        # pre-existing info-level RadioListTile deprecations do not.
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: songbook_app
        run: flutter test

      - name: Test import tooling (Python)
        # Discovery, not a hand-maintained module list. The list this replaces
        # named three modules and had been overtaken four times: it missed
        # test_convert_hymn, test_photo_import_preprocess, test_photo_import_trace
        # and the whole of tools/ocr_harness/, so of the ~320 tests this tree has
        # CI was running 128 — and the gap grew with every file added.
        #
        # Run from the repo root, not from tools/, because the two halves resolve
        # differently: the worker tests `import photo_import_worker` off the
        # discovery start directory, while the harness tests are a package doing
        # `from . import metrics`. Only `-s tools` from the root satisfies both.
        # Every third-party import in this tree (easyocr, cv2, numpy) is inside a
        # function, so discovery stays stdlib-only and needs no pip install.
        run: python -m unittest discover -s tools -p "test_*.py"
