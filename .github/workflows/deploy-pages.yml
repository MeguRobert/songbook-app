name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    # A push that changes only prose changes nothing about the site, but it still
    # ran the whole pipeline, consumed a build number (which is the commit count)
    # and tagged a commit that is byte-identical to the live build. `paths-ignore`
    # only skips when EVERY changed file matches, so a commit touching both docs
    # and code still deploys.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
      # The monthly commit from supabase-keepalive.yml, whose only purpose is to
      # be repository activity so GitHub does not auto-disable the schedule. It
      # changes no code, so deploying it would consume a build number and tag a
      # commit byte-identical to the live one, twelve times a year.
      - '.github/last-keepalive.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.version.outputs.build }}
      semver: ${{ steps.version.outputs.semver }}
      semver_changed: ${{ steps.version.outputs.semver_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count, and the default
          # shallow clone would make every deploy report build 1.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          # Must bundle Dart >= 3.9.0 (pubspec requires sdk: ^3.9.0).
          # 3.35.2 matches the local dev/test environment.
          flutter-version: '3.35.2'
          channel: stable
          cache: true
          # `cache` covers the SDK only — the pub dependencies are a separate
          # input, and without it every deploy re-downloaded the whole package
          # graph before it could run `flutter pub get`.
          pub-cache: true

      - name: Install dependencies
        working-directory: songbook_app
        run: flutter pub get

      - name: Analyze
        working-directory: songbook_app
        # Gate on errors/warnings only. The repo currently carries 8 pre-existing
        # info-level RadioListTile deprecations; --no-fatal-infos keeps those from
        # blocking the deploy while still failing on anything more serious.
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: songbook_app
        # A failing test blocks the deploy — the suite is tracked in git as of
        # 1c0cf1f, so CI runs all of it.
        run: flutter test

      - name: Test import tooling (Python)
        # Discovery rather than a module list, for the reasons spelled out in
        # ci.yml — the list had drifted to 128 of roughly 320 tests. Run from the repo
        # root: `-s tools` is what makes both the flat worker tests and the
        # ocr_harness package importable.
        run: python -m unittest discover -s tools -p "test_*.py"

      # Every deployment must report a distinct, increasing version, so the
      # build number is derived rather than hand-maintained: nobody has to
      # remember to bump it, and there is no commit-back step that would
      # retrigger this workflow. The semantic part stays in pubspec.yaml and is
      # bumped deliberately when a release means something.
      - name: Derive build number from commit count
        id: version
        run: |
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

          # The semantic part, without the +buildnumber suffix.
          read_semver() { sed -n 's/^version: *\([^+]*\).*/\1/p' | tr -d '[:space:]'; }
          semver=$(read_semver < songbook_app/pubspec.yaml)
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

          # A Release is cut only when the semantic version actually moves.
          # Tagging every deploy is cheap and invisible; a Release per deploy
          # would bury the handful that mean something under hundreds of
          # untitled build entries.
          previous=$(git show HEAD~1:songbook_app/pubspec.yaml 2>/dev/null \
            | read_semver || true)
          if [ "$semver" != "$previous" ]; then
            echo "semver_changed=true" >> "$GITHUB_OUTPUT"
            echo "Semantic version ${previous:-none} -> $semver" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "semver_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web
        working-directory: songbook_app
        # --no-web-resources-cdn serves CanvasKit from our own origin rather
        # than www.gstatic.com. Required, not an optimisation:
        # web/index.html sets a Content-Security-Policy that does not let a
        # Google CDN execute script in this origin, so a build without this
        # flag produces an app that does not start at all. The files ship in
        # the build output either way.
        #
        # environment/prod.json carries the Supabase project, the publishable key
        # and the Cloud Run address; environment/README.md says why all three are
        # committed rather than held as Actions secrets, and why none of them is
        # a secret in the first place.
        #
        # **This line is what makes a build production.** The compile-time
        # defaults in supabase_config.dart are STAGING, so naming this file is
        # the only thing that points the app at the congregation's data. Do not
        # remove it on the assumption the defaults will cover it — they will, and
        # they will cover it with staging.
        #
        # PHOTO_IMPORT_ENDPOINT covers only the sheet-music half of photo import:
        # a photographed chord sheet is read in the browser and needs no address.
        run: |
          flutter build web --release \
            --base-href /songbook-app/ \
            --no-web-resources-cdn \
            --dart-define-from-file=environment/prod.json \
            --build-number=${{ steps.version.outputs.build }}

      # A production deploy that quietly built against staging would be a very
      # expensive thing to notice late, and the failure is silent by nature —
      # the app works, it just talks to the wrong database. So assert it, on the
      # compiled output rather than on the flags we believe we passed.
      - name: Confirm this build points at production
        working-directory: songbook_app
        run: |
          set -euo pipefail
          expected=$(python3 -c "import json;print(json.load(open('environment/prod.json'))['SUPABASE_URL'])")
          if ! grep -qF "$expected" build/web/main.dart.js; then
            echo "::error::main.dart.js does not contain $expected — this build is NOT production."
            exit 1
          fi
          if grep -qF 'STAGING_PROJECT_REF' build/web/main.dart.js; then
            echo "::error::main.dart.js still carries the staging placeholder default."
            exit 1
          fi
          echo "Build points at $expected." >> "$GITHUB_STEP_SUMMARY"

      - name: Report deployed version
        working-directory: songbook_app
        run: |
          echo "Deploying $(cat build/web/version.json)" >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- the walk
      #
      # Every serious bug in this app was found by driving a browser and none by
      # `flutter test` — see tools/browser-smoke/README.md, which explains why the
      # widget suite structurally cannot see these seams (it substitutes a font
      # whose every glyph is a full em, it never runs a service worker, and
      # pumpAndSettle hides the timing gaps real frames expose). Until now that
      # technique ran only when somebody remembered to run it, which meant it did
      # not run on the commits that deploy.
      #
      # It walks THIS build — the same bytes the next step uploads — rather than
      # building its own, so a pass is evidence about what is about to go live.
      # That is also why the site is staged under a `songbook-app/` directory:
      # the build carries `--base-href /songbook-app/`, so served at the server
      # root every asset path would 404 and all 28 checks would fail for a reason
      # that has nothing to do with the app.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        # Installed into a scratch directory and reached through NODE_PATH, not
        # into the repo: the root package.json exists only to pin the Supabase
        # CLI, and `npm i` there would drag that whole tree in for no reason.
        # Version-pinned to match the local dev machine — an unpinned browser
        # engine turns this gate into a moving target.
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm i --silent playwright@1.59.1
          npx playwright install --with-deps chromium

      - name: Browser walk
        timeout-minutes: 12
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        # The walk is retried once, and the retry is reported rather than hidden.
        #
        # This is not defensive boilerplate: writing this step, one run of three
        # failed `the four-part song is in the list` and then passed twice on the
        # identical build. The cause is `stableSemantics`, which calls the
        # accessibility tree settled as soon as one poll matches the previous one
        # — a tree still being populated can hold still for 400ms and read as
        # finished. So a single red run is not evidence of a regression, but two
        # in a row are, and a real break fails both times. If the summary below
        # starts saying "passed on retry" often, harden the harness rather than
        # raising the retry count.
        run: |
          set -o pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/songbook-app"
          cp -r songbook_app/build/web/. "$site/songbook-app/"

          python3 -m http.server 8795 --bind 127.0.0.1 --directory "$site" &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8795/songbook-app/index.html && break
            sleep 1
          done

          walk() { node tools/browser-smoke/smoke.js --base http://127.0.0.1:8795/songbook-app; }
          if walk; then
            echo "Browser walk: passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "First walk failed — retrying once (see the step log for which check)."
            if walk; then
              echo "Browser walk: **passed on retry** — first attempt failed. Flake, or a real intermittent bug; the log names the check." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Browser walk: **failed twice**. Screenshots are in the \`browser-walk-shots\` artifact." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: Keep the walk's screenshots when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-walk-shots
          path: tools/browser-smoke/shots
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        with:
          path: songbook_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Marks the commit that produced the live site.
  #
  # `version.json` reports a build number, but nothing mapped that number back
  # to a commit — finding the source of "build 148" meant computing
  # `git rev-list --count` against candidates. A tag makes it one command:
  #
  #     git checkout -b hotfix build-148
  #
  # Runs after `deploy`, not after `build`: a tag on something that never
  # reached the live site would be a lie.
  tag:
    needs: [build, deploy]
    # Only the branch that actually serves the site. Kept now that the stale
    # `claude/phase-9-tags-search` trigger is gone, because `workflow_dispatch`
    # can still be fired from any branch — and a build number tagged onto a
    # commit that is not what production is running would be a lie.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD: ${{ needs.build.outputs.build }}
      SEMVER: ${{ needs.build.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag this deployment
        run: |
          tag="build-$BUILD"
          # workflow_dispatch can re-run against a commit that is already
          # tagged. Re-tagging is not an error worth failing a green deploy
          # over, and force-moving the tag would silently rewrite history.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Deployed build $BUILD (v$SEMVER)"
          git push origin "$tag"
          echo "Tagged \`$tag\` -> $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cut a Release when the semantic version moved
        if: needs.build.outputs.semver_changed == 'true'
        run: |
          tag="v$SEMVER"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "v$SEMVER" \
            --generate-notes
          echo "Released **$tag** (build $BUILD)" >> "$GITHUB_STEP_SUMMARY"
