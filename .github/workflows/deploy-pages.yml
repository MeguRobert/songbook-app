name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/phase-9-tags-search
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count, and the default
          # shallow clone would make every deploy report build 1.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          # Must bundle Dart >= 3.9.0 (pubspec requires sdk: ^3.9.0).
          # 3.35.2 matches the local dev/test environment.
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: songbook_app
        run: flutter pub get

      - name: Analyze
        working-directory: songbook_app
        # Gate on errors/warnings only. The repo currently carries 8 pre-existing
        # info-level RadioListTile deprecations; --no-fatal-infos keeps those from
        # blocking the deploy while still failing on anything more serious.
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: songbook_app
        # A failing test blocks the deploy — the suite is tracked in git as of
        # 1c0cf1f, so CI runs all of it.
        run: flutter test

      - name: Test import tooling (Python)
        working-directory: tools
        run: python -m unittest test_song_validator test_batch_import

      # Every deployment must report a distinct, increasing version, so the
      # build number is derived rather than hand-maintained: nobody has to
      # remember to bump it, and there is no commit-back step that would
      # retrigger this workflow. The semantic part stays in pubspec.yaml and is
      # bumped deliberately when a release means something.
      - name: Derive build number from commit count
        id: version
        run: echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build web
        working-directory: songbook_app
        run: |
          flutter build web --release \
            --base-href /songbook-app/ \
            --build-number=${{ steps.version.outputs.build }}

      - name: Report deployed version
        working-directory: songbook_app
        run: |
          echo "Deploying $(cat build/web/version.json)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: songbook_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
