name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/phase-9-tags-search
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: songbook_app
        run: flutter pub get

      - name: Build web
        working-directory: songbook_app
        run: flutter build web --release --base-href /songbook-app/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: songbook_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
